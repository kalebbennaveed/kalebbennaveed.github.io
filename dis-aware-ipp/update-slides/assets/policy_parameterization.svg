<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="400" viewBox="0 0 1700 400"><title>Policy parameterization over the initial acceleration interval and future reference interval</title><defs>
<marker id="a00274c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#00274c"/></marker>
<marker id="a2474bf" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#2474bf"/></marker>
<marker id="a9b4682" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#9b4682"/></marker>
<marker id="a008653" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#008653"/></marker>
<marker id="ad77717" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#d77717"/></marker>
<marker id="a667889" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#667889"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<g id="initial" data-panel="initial" data-bounds="25,65,440,255">
<rect x="25" y="65" width="440" height="255" rx="12" fill="#fbfcfe" stroke="#b5c7d6" stroke-width="2"/>
<circle cx="60" cy="106" r="21" fill="#00274c" opacity="1"/>
<text x="60" y="115" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="95" y="115" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#00274c" text-anchor="start">Initial interval: 0–2 s</text>
<text x="50" y="172" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#00274c" text-anchor="start">Two acceleration parameters</text>
<text x="50" y="220" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#00274c" text-anchor="start">a₀, a₁ ∈ ℝ²</text>
<text x="50" y="280" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2474bf" text-anchor="start">Interpolate nominal acceleration.</text>
</g>
<g id="reference" data-panel="reference" data-bounds="545,65,620,255">
<rect x="545" y="65" width="620" height="255" rx="12" fill="#fbfcfe" stroke="#b5c7d6" stroke-width="2"/>
<circle cx="580" cy="106" r="21" fill="#00274c" opacity="1"/>
<text x="580" y="115" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="615" y="115" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#00274c" text-anchor="start">Future interval: 2–10 s</text>
<text x="570" y="172" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#00274c" text-anchor="start">Four position parameters ξ₁, …, ξ₄</text>
<text x="570" y="217" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#00274c" text-anchor="start">Belief-response matrix G ∈ ℝ²ˣ³</text>
<text x="570" y="280" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2474bf" text-anchor="start">Construct a cubic reference trajectory.</text>
</g>
<g id="nominal" data-panel="nominal" data-bounds="1245,65,430,255">
<rect x="1245" y="65" width="430" height="255" rx="12" fill="#fbfcfe" stroke="#b5c7d6" stroke-width="2"/>
<circle cx="1280" cy="106" r="21" fill="#00274c" opacity="1"/>
<text x="1280" y="115" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="1315" y="115" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#00274c" text-anchor="start">Nominal input</text>
<text x="1270" y="172" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#00274c" text-anchor="start">Track the reference.</text>
<text x="1270" y="220" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#00274c" text-anchor="start">Compensate estimated wind.</text>
<text x="1270" y="280" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2474bf" text-anchor="start">Nominal control input</text>
</g>
<polyline data-connector="initial:reference" points="465,195 545,195" fill="none" stroke="#00274c" stroke-width="3" stroke-linejoin="round" marker-end="url(#a00274c)"/>
<polyline data-connector="reference:nominal" points="1165,195 1245,195" fill="none" stroke="#00274c" stroke-width="3" stroke-linejoin="round" marker-end="url(#a00274c)"/>
<text x="850" y="375" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#00274c" text-anchor="middle">Robot motion is computed afterward from the modified input and disturbed dynamics.</text>
</svg>